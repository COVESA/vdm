[project]
name = "vdm"
version = "0.1.0"
description = "Tooling configuration support for VDM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "s2dm>=0,<1",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Tasks: run with `uv run poe <task-name>`
# ---------------------------------------------------------------------------
[tool.poe.tasks]

# --- Schema checks (also used as PR CI gates) ---
validate.cmd  = "s2dm validate graphql -s spec/vss/ -o _output/graphql/introspection.json"
validate.help = "Validate GraphQL schema and emit introspection JSON"

check.cmd     = "s2dm check constraints -s spec/vss/"
check.help    = "Enforce S2DM constraints (directives, naming, cardinality)"

[tool.poe.tasks.ci-checks]
sequence = ["validate", "check"]
help     = "Run all PR CI checks (validate + constraints)"

# --- GH Pages: build static Voyager site ---
[tool.poe.tasks.build-voyager]
shell = """
mkdir -p site
cp docs/voyager/index.html site/index.html
cp _output/graphql/introspection.json site/introspection.json
echo '✓ Voyager site ready in ./site/ — open site/index.html in a browser'
"""
help = "Build static Voyager site into ./site/ (run poe validate first)"

[tool.poe.tasks.voyager]
sequence = ["validate", "build-voyager"]
help     = "Generate introspection JSON then build Voyager site"

[dependency-groups]
dev = [
    "poethepoet>=0.45.0",
]
