name: Deploy S2DM Docs to GitHub Pages
# Live site: https://covesa.github.io/vdm/

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Required for GitHub Pages deployment via the reusable workflow
permissions:
  pages: write
  id-token: write

jobs:
  docs:
    uses: COVESA/s2dm/.github/workflows/docs-build.yml@main
    with:
      project_title: "Vehicle Data Model"
      project_name: vdm
      org_name: COVESA
      pages_url: https://covesa.github.io/vdm
      github_repo_url: https://github.com/COVESA/vdm
      schema_sources: "spec"
