name: Deploy S2DM Docs to GitHub Pages
# Live site: https://covesa.github.io/vdm/

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.docs.outputs.page-url }}

    steps:
      - uses: actions/checkout@v4

      - id: docs
        uses: COVESA/s2dm/actions/s2dm-docs-build@main
        with:
          project-title: "Vehicle Data Model"
          project-name: vdm
          org-name: COVESA
          pages-url: https://covesa.github.io/vdm
          github-repo-url: https://github.com/COVESA/vdm
          schema-sources: "spec"
