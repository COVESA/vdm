<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VDM — Schema Explorer</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      #voyager { height: 100vh; }
      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #555;
        gap: 12px;
      }
      #loading h1 { font-size: 1.2rem; font-weight: 600; margin: 0; }
      #loading p  { font-size: 0.9rem; margin: 0; color: #888; }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/graphql-voyager@2.1.0/dist/voyager.css"
    />
  </head>
  <body>
    <div id="voyager">
      <div id="loading">
        <h1>Vehicle Data Model — Schema Explorer</h1>
        <p>Loading schema…</p>
      </div>
    </div>

    <script src="https://unpkg.com/graphql-voyager@2.1.0/dist/voyager.standalone.js"></script>
    <script>
      fetch('./introspection.json')
        .then(function (response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status + ' — ' + response.statusText);
          }
          return response.json();
        })
        .then(function (schema) {
          // graphql-inspector produces { __schema: ... }
          // Voyager expects { data: { __schema: ... } }
          GraphQLVoyager.init(document.getElementById('voyager'), {
            introspection: { data: schema },
          });
        })
        .catch(function (err) {
          var el = document.getElementById('loading');
          el.innerHTML =
            '<h1>Failed to load schema</h1><p>' + err.message + '</p>';
        });
    </script>
  </body>
</html>
