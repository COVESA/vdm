type Person {
    id: ID!
    name: PersonName
    ageRange: AgeRange
    homeAddress: Address
}

type PersonName {
    first: String!
    middle: String
    last: String!
}

type Address {
    street: String!
    city: String!
    state: String!
    zip: String!
}

enum AgeRange {
    CHILD
    TEEN
    ADULT
    SENIOR
}