# Domain-specific GraphQL types

"""
Occupant (Driver or Passenger) data.
"""
type Occupant @vspec(element: BRANCH, fqn: "Vehicle.Occupant") {
  headPosition: HeadPosition @vspec(element: BRANCH, fqn: "Vehicle.Occupant.HeadPosition")
  identifier: Identifier @vspec(element: BRANCH, fqn: "Vehicle.Occupant.Identifier")
  midEyeGaze: MidEyeGaze @vspec(element: BRANCH, fqn: "Vehicle.Occupant.MidEyeGaze")
}
