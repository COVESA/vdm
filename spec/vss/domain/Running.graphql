# Domain-specific GraphQL types

"""
Daytime running lights (DRL).
"""
type Running @vspec(element: BRANCH, fqn: "Vehicle.Body.Lights.Running") {
  """
  Indicates if light is defect. True = Light is defect. False = Light has no defect.
  """
  isDefect: Boolean @vspec(element: SENSOR, fqn: "Vehicle.Body.Lights.Running.IsDefect")

  """
  Indicates if light is on or off. True = On. False = Off.
  """
  isOn: Boolean @vspec(element: ACTUATOR, fqn: "Vehicle.Body.Lights.Running.IsOn")
}
