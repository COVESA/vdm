# Domain-specific GraphQL types


"""Diagnostics data."""
type Diagnostics @vspec(element: BRANCH, fqn: "Vehicle.Diagnostics") {
  """Number of Diagnostic Trouble Codes (DTC)"""
  dtccount: UInt8 @vspec(element: SENSOR, fqn: "Vehicle.Diagnostics.DTCCount")

  """
  List of currently active DTCs formatted according OBD II (SAE-J2012DA_201812) standard ([P|C|B|U]XXXXX )
  """
  dtclist: [String!] @vspec(element: SENSOR, fqn: "Vehicle.Diagnostics.DTCList")
}