# Domain-specific GraphQL types


"""High-level vehicle data."""
type Vehicle @vspec(element: BRANCH, fqn: "Vehicle") {
  id: ID!

  """Average speed for the current trip."""
  averageSpeed(unit: VelocityUnitEnum = KILOMETER_PER_HOUR): Float @vspec(element: SENSOR, fqn: "Vehicle.AverageSpeed")

  """
  The available volume for cargo or luggage. For automobiles, this is usually the trunk volume.
  """
  cargoVolume(unit: VolumeUnitEnum = LITER): Float @vspec(element: ATTRIBUTE, fqn: "Vehicle.CargoVolume")
    @range(min: 0)

  """
  Vehicle curb weight, including all liquids and full tank of fuel, but no cargo or passengers.
  """
  curbWeight(unit: MassUnitEnum = KILOGRAM): UInt16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.CurbWeight")

  """
  Current overall Vehicle weight. Including passengers, cargo and other load inside the car.
  """
  currentOverallWeight(unit: MassUnitEnum = KILOGRAM): UInt16 @vspec(element: SENSOR, fqn: "Vehicle.CurrentOverallWeight")

  """The CO2 emissions."""
  emissionsCo2(unit: MassPerDistanceUnitEnum = GRAMS_PER_KILOMETER): Int16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.EmissionsCO2")

  """
  Curb weight of vehicle, including all liquids and full tank of fuel and full load of cargo and passengers.
  """
  grossWeight(unit: MassUnitEnum = KILOGRAM): UInt16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.GrossWeight")

  """Overall vehicle height."""
  height(unit: LengthUnitEnum = MILLIMETER): UInt16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.Height")

  """
  Auto Power Optimization Flag When set to 'true', the system enables automatic power optimization, dynamically adjusting the power optimization level based on runtime conditions or features managed by the OEM. When set to 'false', manual control of the power optimization level is allowed.
  """
  isAutoPowerOptimize: Boolean @vspec(element: ACTUATOR, fqn: "Vehicle.IsAutoPowerOptimize")

  """
  Vehicle breakdown or any similar event causing vehicle to stop on the road, that might pose a risk to other road users. True = Vehicle broken down on the road, due to e.g. engine problems, flat tire, out of gas, brake problems. False = Vehicle not broken down.
  """
  isBrokenDown: Boolean @vspec(element: SENSOR, fqn: "Vehicle.IsBrokenDown")

  """Indicates whether the vehicle is stationary or moving."""
  isMoving: Boolean @vspec(element: SENSOR, fqn: "Vehicle.IsMoving")

  """Overall vehicle length."""
  length(unit: LengthUnitEnum = MILLIMETER): UInt16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.Length")

  """State of the supply voltage of the control units (usually 12V)."""
  lowVoltageSystemState: Vehicle_LowVoltageSystemState_Enum @vspec(element: SENSOR, fqn: "Vehicle.LowVoltageSystemState")

  """Maximum vertical weight on the tow ball of a trailer."""
  maxTowBallWeight(unit: MassUnitEnum = KILOGRAM): UInt16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.MaxTowBallWeight")

  """Maximum weight of trailer."""
  maxTowWeight(unit: MassUnitEnum = KILOGRAM): UInt16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.MaxTowWeight")

  """
  Power optimization level for this branch/subsystem. A higher number indicates more aggressive power optimization. Level 0 indicates that all functionality is enabled, no power optimization enabled. Level 10 indicates most aggressive power optimization mode, only essential functionality enabled.
  """
  powerOptimizeLevel: UInt8 @vspec(element: ACTUATOR, fqn: "Vehicle.PowerOptimizeLevel")
    @range(min: 0, max: 10)

  """
  The permitted total weight of cargo and installations (e.g. a roof rack) on top of the vehicle.
  """
  roofLoad(unit: MassUnitEnum = KILOGRAM): Int16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.RoofLoad")

  """Vehicle speed."""
  speed(unit: VelocityUnitEnum = KILOMETER_PER_HOUR): Float @vspec(element: SENSOR, fqn: "Vehicle.Speed")

  """
  Start time of current or latest trip, formatted according to ISO 8601 with UTC time zone.
  """
  startTime(unit: DatetimeUnitEnum = ISO_8601): String @vspec(element: ATTRIBUTE, fqn: "Vehicle.StartTime")

  """
  Odometer reading, total distance traveled during the lifetime of the vehicle.
  """
  traveledDistance(unit: LengthUnitEnum = METER): UInt32 @vspec(element: SENSOR, fqn: "Vehicle.TraveledDistance")

  """Distance traveled since start of current trip."""
  traveledDistanceSinceStart(unit: LengthUnitEnum = METER): UInt32 @vspec(element: SENSOR, fqn: "Vehicle.TraveledDistanceSinceStart")

  """Duration of latest trip."""
  tripDuration(unit: DurationUnitEnum = SECOND): Float @vspec(element: SENSOR, fqn: "Vehicle.TripDuration")

  """Trip meter reading."""
  tripMeterReading(unit: LengthUnitEnum = METER): UInt32 @vspec(element: ACTUATOR, fqn: "Vehicle.TripMeterReading")

  """
  Minimum turning diameter, Wall-to-Wall, as defined by SAE J1100-2009 D102.
  """
  turningDiameter(unit: LengthUnitEnum = MILLIMETER): UInt16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.TurningDiameter")

  """
  Overall vehicle width excluding mirrors, as defined by SAE J1100-2009 W103.
  """
  widthExcludingMirrors(unit: LengthUnitEnum = MILLIMETER): UInt16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.WidthExcludingMirrors")

  """
  Overall vehicle width with mirrors folded, as defined by SAE J1100-2009 W145.
  """
  widthFoldedMirrors(unit: LengthUnitEnum = MILLIMETER): UInt16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.WidthFoldedMirrors")

  """
  Overall vehicle width including mirrors, as defined by SAE J1100-2009 W144.
  """
  widthIncludingMirrors(unit: LengthUnitEnum = MILLIMETER): UInt16 @vspec(element: ATTRIBUTE, fqn: "Vehicle.WidthIncludingMirrors")
  adas: ADAS
  acceleration: Acceleration
  angularVelocity: AngularVelocity
  body: Body
  cabin: Cabin
  chassis: Chassis
  connectivity: Connectivity
  controlUnits: [ControlUnit]
  currentLocation: CurrentLocation
  diagnostics: Diagnostics
  driver: Driver
  exterior: Exterior
  lowVoltageBattery: LowVoltageBattery
  motionManagement: MotionManagement
  occupants: [Occupant]
  powertrain: Powertrain
  service: Service
  trailer: Trailer
  vehicleIdentification: VehicleIdentification
  versionVss: VersionVSS
}

"""Allowed values for Vehicle.LowVoltageSystemState."""
enum Vehicle_LowVoltageSystemState_Enum @vspec(element: SENSOR, fqn: "Vehicle.LowVoltageSystemState", metadata: [{key: "allowed", value: "['UNDEFINED', 'LOCK', 'OFF', 'ACC', 'ON', 'START']"}]) {
  UNDEFINED
  LOCK
  OFF
  ACC
  ON
  START
}