# Domain-specific GraphQL types

"""
Spotlight for a specific area in the vehicle.
"""
type Spotlight @vspec(element: BRANCH, fqn: "Vehicle.Cabin.Light.Spotlight") {
  """
  Hexadecimal color code represented as a 3-byte RGB (i.e. Red, Green, and Blue) value preceded by a hash symbol "#". Allowed range "#000000" to "#FFFFFF".
  """
  color: String @vspec(element: ACTUATOR, fqn: "Vehicle.Cabin.Light.Spotlight.Color")

  """
  How much of the maximum possible brightness of the light is used. 1 = Maximum attenuation, 100 = No attenuation (i.e. full brightness).
  """
  intensity(unit: RelationUnitEnum = PERCENT): UInt8
    @vspec(element: ACTUATOR, fqn: "Vehicle.Cabin.Light.Spotlight.Intensity")
    @range(min: 1, max: 100)

  """
  Indicates whether the light is turned on. True = On, False = Off.
  """
  isLightOn: Boolean @vspec(element: ACTUATOR, fqn: "Vehicle.Cabin.Light.Spotlight.IsLightOn")
}
