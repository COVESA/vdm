# Domain-specific GraphQL types


"""Ethernet network attributes and signals"""
type ETH @vspec(element: BRANCH, fqn: "Vehicle.ControlUnit.Health.Network.ETH") {
  """
  Network status. True = No network problems detected. False = Network problems detected.
  """
  isNetworkOk: Boolean @vspec(element: SENSOR, fqn: "Vehicle.ControlUnit.Health.Network.ETH.IsNetworkOK")
}