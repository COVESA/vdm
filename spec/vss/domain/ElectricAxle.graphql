# Domain-specific GraphQL types


"""MotionManagement for a specific electric axle."""
type ElectricAxle @vspec(element: BRANCH, fqn: "Vehicle.MotionManagement.ElectricAxle") {
  id: ID!

  """
  Rotational speed for the specified axle, positive sign for rotation in forward direction, negative sign for rotation in backward direction.
  """
  rotationalSpeed(unit: RotationalSpeedUnitEnum = REVOLUTIONS_PER_MINUTE): Int16 @vspec(element: SENSOR, fqn: "Vehicle.MotionManagement.ElectricAxle.RotationalSpeed")

  """
  Maximum allowed axle rotational speed in torque control mode, positive sign for rotation in forward direction, negative sign for rotation in backward direction.
  """
  rotationalSpeedMaximumLimit(unit: RotationalSpeedUnitEnum = REVOLUTIONS_PER_MINUTE): Int16 @vspec(element: ACTUATOR, fqn: "Vehicle.MotionManagement.ElectricAxle.RotationalSpeedMaximumLimit")

  """
  Minimum allowed axle rotational speed in torque control mode, positive sign for rotation in forward direction, negative sign for rotation in backward direction.
  """
  rotationalSpeedMinimumLimit(unit: RotationalSpeedUnitEnum = REVOLUTIONS_PER_MINUTE): Int16 @vspec(element: ACTUATOR, fqn: "Vehicle.MotionManagement.ElectricAxle.RotationalSpeedMinimumLimit")

  """
  Target axle rotational speed in rotation speed control mode, positive sign for rotation in forward direction, negative sign for rotation in backward direction.
  """
  rotationalSpeedTarget(unit: RotationalSpeedUnitEnum = REVOLUTIONS_PER_MINUTE): Int16 @vspec(element: ACTUATOR, fqn: "Vehicle.MotionManagement.ElectricAxle.RotationalSpeedTarget")

  """
  Axle torque, positive sign for torque in forward direction, negative sign for torque in backward direction.
  """
  torque(unit: TorqueUnitEnum = NEWTON_METER): Int16 @vspec(element: SENSOR, fqn: "Vehicle.MotionManagement.ElectricAxle.Torque")

  """
  Maximum momentarily available eAxle torque, positive sign for torque in forward direction, negative sign for torque in backward direction.
  """
  torqueMaximum(unit: TorqueUnitEnum = NEWTON_METER): Int16 @vspec(element: SENSOR, fqn: "Vehicle.MotionManagement.ElectricAxle.TorqueMaximum")

  """
  Maximum allowed eAxle torque in rotation speed control mode, positive sign for torque in forward direction, negative sign unused.
  """
  torqueMaximumLimit(unit: TorqueUnitEnum = NEWTON_METER): Int16 @vspec(element: ACTUATOR, fqn: "Vehicle.MotionManagement.ElectricAxle.TorqueMaximumLimit")

  """
  Minimum momentarily available eAxle torque, positive sign for torque in forward direction, negative sign for torque in backward direction.
  """
  torqueMinimum(unit: TorqueUnitEnum = NEWTON_METER): Int16 @vspec(element: SENSOR, fqn: "Vehicle.MotionManagement.ElectricAxle.TorqueMinimum")

  """
  Minimum allowed axle torque in rotation speed control mode, positive sign unused, negative sign for torque in backward direction (ISO8855).
  """
  torqueMinimumLimit(unit: TorqueUnitEnum = NEWTON_METER): Int16 @vspec(element: ACTUATOR, fqn: "Vehicle.MotionManagement.ElectricAxle.TorqueMinimumLimit")

  """
  Target axle torque in torque control mode, positive sign for torque in forward direction, negative sign for torque in backward direction (ISO8855).
  """
  torqueTarget(unit: TorqueUnitEnum = NEWTON_METER): Int16 @vspec(element: ACTUATOR, fqn: "Vehicle.MotionManagement.ElectricAxle.TorqueTarget")
}