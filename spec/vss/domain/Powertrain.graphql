# Domain-specific GraphQL types


"""Powertrain data for battery management, etc."""
type Powertrain @vspec(element: BRANCH, fqn: "Vehicle.Powertrain") {
  """The accumulated energy from regenerative braking over lifetime."""
  accumulatedBrakingEnergy(unit: WorkUnitEnum = KILOWATT_HOURS): Float @vspec(element: SENSOR, fqn: "Vehicle.Powertrain.AccumulatedBrakingEnergy")

  """
  Auto Power Optimization Flag When set to 'true', the system enables automatic power optimization, dynamically adjusting the power optimization level based on runtime conditions or features managed by the OEM. When set to 'false', manual control of the power optimization level is allowed.
  """
  isAutoPowerOptimize: Boolean @vspec(element: ACTUATOR, fqn: "Vehicle.Powertrain.IsAutoPowerOptimize")

  """
  Power optimization level for this branch/subsystem. A higher number indicates more aggressive power optimization. Level 0 indicates that all functionality is enabled, no power optimization enabled. Level 10 indicates most aggressive power optimization mode, only essential functionality enabled.
  """
  powerOptimizeLevel: UInt8 @vspec(element: ACTUATOR, fqn: "Vehicle.Powertrain.PowerOptimizeLevel")
    @range(min: 0, max: 10)

  """
  Remaining range in meters using all energy sources available in the vehicle.
  """
  range(unit: LengthUnitEnum = METER): UInt32 @vspec(element: SENSOR, fqn: "Vehicle.Powertrain.Range")

  """
  Time remaining in seconds before all energy sources available in the vehicle are empty.
  """
  timeRemaining(unit: DurationUnitEnum = SECOND): UInt32 @vspec(element: SENSOR, fqn: "Vehicle.Powertrain.TimeRemaining")

  """Defines the powertrain type of the vehicle."""
  type: Vehicle_Powertrain_Type_Enum @vspec(element: ATTRIBUTE, fqn: "Vehicle.Powertrain.Type")
  combustionEngine: CombustionEngine
  electricMotor: ElectricMotor
  fuelSystem: FuelSystem
  rangeExtender: RangeExtender
  tractionBattery: TractionBattery
  transmission: Transmission
}

"""Allowed values for Vehicle.Powertrain.Type."""
enum Vehicle_Powertrain_Type_Enum @vspec(element: ATTRIBUTE, fqn: "Vehicle.Powertrain.Type", metadata: [{key: "allowed", value: "['COMBUSTION', 'HYBRID', 'ELECTRIC']"}]) {
  COMBUSTION
  HYBRID
  ELECTRIC
}