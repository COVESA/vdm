# Domain-specific GraphQL types

"""
Airbag signals.
"""
type Airbag @vspec(element: BRANCH, fqn: "Vehicle.Cabin.Seat.Airbag") {
  """
  Airbag deployment status. True = Airbag deployed. False = Airbag not deployed.
  """
  isDeployed: Boolean @vspec(element: SENSOR, fqn: "Vehicle.Cabin.Seat.Airbag.IsDeployed")

  """
  Airbag enabled status. True = Airbag enabled. False = Airbag not enabled.
  """
  isEnabled: Boolean @vspec(element: SENSOR, fqn: "Vehicle.Cabin.Seat.Airbag.IsEnabled")
}
