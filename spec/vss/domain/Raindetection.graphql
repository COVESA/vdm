# Domain-specific GraphQL types


"""Rain sensor signals."""
type Raindetection @vspec(element: BRANCH, fqn: "Vehicle.Body.Raindetection") {
  """Rain intensity. 0 = Dry, No Rain. 100 = Covered."""
  intensity(unit: RelationUnitEnum = PERCENT): UInt8 @vspec(element: SENSOR, fqn: "Vehicle.Body.Raindetection.Intensity")
    @range(max: 100)
}