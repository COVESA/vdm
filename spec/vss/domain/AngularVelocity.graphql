# Domain-specific GraphQL types

"""
Spatial rotation. Axis definitions according to ISO 8855.
"""
type AngularVelocity @vspec(element: BRANCH, fqn: "Vehicle.AngularVelocity") {
  """
  Vehicle rotation rate along Y (lateral).
  """
  pitch(unit: AngularSpeedUnitEnum = DEGREE_PER_SECOND): Float
    @vspec(element: SENSOR, fqn: "Vehicle.AngularVelocity.Pitch")

  """
  Vehicle rotation rate along X (longitudinal).
  """
  roll(unit: AngularSpeedUnitEnum = DEGREE_PER_SECOND): Float
    @vspec(element: SENSOR, fqn: "Vehicle.AngularVelocity.Roll")

  """
  Vehicle rotation rate along Z (vertical).
  """
  yaw(unit: AngularSpeedUnitEnum = DEGREE_PER_SECOND): Float
    @vspec(element: SENSOR, fqn: "Vehicle.AngularVelocity.Yaw")
}
