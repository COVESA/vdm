# Domain-specific GraphQL types


"""All in-cabin components, including doors."""
type Cabin @vspec(element: BRANCH, fqn: "Vehicle.Cabin") {
  """Number of doors in vehicle."""
  doorCount: UInt8 @vspec(element: ATTRIBUTE, fqn: "Vehicle.Cabin.DoorCount")

  """The position of the driver seat in row 1."""
  driverPosition: Vehicle_Cabin_DriverPosition_Enum @vspec(element: ATTRIBUTE, fqn: "Vehicle.Cabin.DriverPosition")

  """
  Auto Power Optimization Flag When set to 'true', the system enables automatic power optimization, dynamically adjusting the power optimization level based on runtime conditions or features managed by the OEM. When set to 'false', manual control of the power optimization level is allowed.
  """
  isAutoPowerOptimize: Boolean @vspec(element: ACTUATOR, fqn: "Vehicle.Cabin.IsAutoPowerOptimize")

  """Is window child lock engaged. True = Engaged. False = Disengaged."""
  isWindowChildLockEngaged: Boolean @vspec(element: ACTUATOR, fqn: "Vehicle.Cabin.IsWindowChildLockEngaged")

  """
  Power optimization level for this branch/subsystem. A higher number indicates more aggressive power optimization. Level 0 indicates that all functionality is enabled, no power optimization enabled. Level 10 indicates most aggressive power optimization mode, only essential functionality enabled.
  """
  powerOptimizeLevel: UInt8 @vspec(element: ACTUATOR, fqn: "Vehicle.Cabin.PowerOptimizeLevel")
    @range(min: 0, max: 10)

  """Number of seats across each row from the front to the rear."""
  seatPosCount: [UInt8!] @vspec(element: ATTRIBUTE, fqn: "Vehicle.Cabin.SeatPosCount")

  """Number of seat rows in vehicle."""
  seatRowCount: UInt8 @vspec(element: ATTRIBUTE, fqn: "Vehicle.Cabin.SeatRowCount")
  convertible: Convertible
  doors: [Door]
  hvac: HVAC
  infotainment: Infotainment
  light: Light
  rearShade: RearShade
  rearviewMirror: RearviewMirror
  seats: [Seat]
  sunroof: Sunroof
}

"""Allowed values for Vehicle.Cabin.DriverPosition."""
enum Vehicle_Cabin_DriverPosition_Enum @vspec(element: ATTRIBUTE, fqn: "Vehicle.Cabin.DriverPosition", metadata: [{key: "allowed", value: "['LEFT', 'MIDDLE', 'RIGHT']"}]) {
  LEFT
  MIDDLE
  RIGHT
}