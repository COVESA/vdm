# Domain-specific GraphQL types

"""
Emergency Brake Assist (EBA) System signals.
"""
type EBA @vspec(element: BRANCH, fqn: "Vehicle.ADAS.EBA") {
  """
  Indicates if EBA is enabled. True = Enabled. False = Disabled.
  """
  isEnabled: Boolean @vspec(element: ACTUATOR, fqn: "Vehicle.ADAS.EBA.IsEnabled")

  """
  Indicates if EBA is currently regulating brake pressure. True = Engaged. False = Not Engaged.
  """
  isEngaged: Boolean @vspec(element: SENSOR, fqn: "Vehicle.ADAS.EBA.IsEngaged")

  """
  Indicates if EBA incurred an error condition. True = Error. False = No Error.
  """
  isError: Boolean @vspec(element: SENSOR, fqn: "Vehicle.ADAS.EBA.IsError")
}
