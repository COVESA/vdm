# Domain-specific GraphQL types

"""
Fog lights.
"""
type Fog @vspec(element: BRANCH, fqn: "Vehicle.Body.Lights.Fog") {
  """
  Indicates if light is defect. True = Light is defect. False = Light has no defect.
  """
  isDefect: Boolean @vspec(element: SENSOR, fqn: "Vehicle.Body.Lights.Fog.IsDefect")

  """
  Indicates if light is on or off. True = On. False = Off.
  """
  isOn: Boolean @vspec(element: ACTUATOR, fqn: "Vehicle.Body.Lights.Fog.IsOn")
}
