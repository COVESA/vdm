# Domain-specific GraphQL types

"""
Accelerator signals
"""
type Accelerator @vspec(element: BRANCH, fqn: "Vehicle.Chassis.Accelerator") {
  """
  Accelerator pedal position as percent. 0 = Not depressed. 100 = Fully depressed.
  """
  pedalPosition(unit: RelationUnitEnum = PERCENT): UInt8
    @vspec(element: SENSOR, fqn: "Vehicle.Chassis.Accelerator.PedalPosition")
    @range(min: 0, max: 100)
}
