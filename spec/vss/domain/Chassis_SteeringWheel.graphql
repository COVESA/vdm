# Domain-specific GraphQL types

"""
Steering wheel signals
"""
type Chassis_SteeringWheel @vspec(element: BRANCH, fqn: "Vehicle.Chassis.SteeringWheel") {
  """
  Steering wheel angle. Positive = degrees to the left. Negative = degrees to the right.
  """
  angle(unit: AngleUnitEnum = DEGREE): Int16
    @vspec(element: SENSOR, fqn: "Vehicle.Chassis.SteeringWheel.Angle")

  """
  Steering wheel column extension from dashboard. 0 = Closest to dashboard. 100 = Furthest from dashboard.
  """
  extension(unit: RelationUnitEnum = PERCENT): UInt8
    @vspec(element: ACTUATOR, fqn: "Vehicle.Chassis.SteeringWheel.Extension")
    @range(min: 0, max: 100)

  """
  Heating or Cooling requsted for the Item. -100 = Maximum cooling, 0 = Heating/cooling deactivated, 100 = Maximum heating.
  """
  heatingCooling(unit: RelationUnitEnum = PERCENT): Int8
    @vspec(element: ACTUATOR, fqn: "Vehicle.Chassis.SteeringWheel.HeatingCooling")
    @range(min: -100, max: 100)

  """
  Steering wheel column tilt. 0 = Lowest position. 100 = Highest position.
  """
  tilt(unit: RelationUnitEnum = PERCENT): UInt8
    @vspec(element: ACTUATOR, fqn: "Vehicle.Chassis.SteeringWheel.Tilt")
    @range(min: 0, max: 100)
}
