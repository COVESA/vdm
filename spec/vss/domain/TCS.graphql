# Domain-specific GraphQL types


"""Traction Control System signals."""
type TCS @vspec(element: BRANCH, fqn: "Vehicle.ADAS.TCS") {
  """Indicates if TCS is enabled. True = Enabled. False = Disabled."""
  isEnabled: Boolean @vspec(element: ACTUATOR, fqn: "Vehicle.ADAS.TCS.IsEnabled")

  """
  Indicates if TCS is currently regulating traction. True = Engaged. False = Not Engaged.
  """
  isEngaged: Boolean @vspec(element: SENSOR, fqn: "Vehicle.ADAS.TCS.IsEngaged")

  """
  Indicates if TCS incurred an error condition. True = Error. False = No Error.
  """
  isError: Boolean @vspec(element: SENSOR, fqn: "Vehicle.ADAS.TCS.IsError")
}