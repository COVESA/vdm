# Domain-specific GraphQL types


"""A navigation has been selected."""
type DestinationSet @vspec(element: BRANCH, fqn: "Vehicle.Cabin.Infotainment.Navigation.DestinationSet") {
  """Latitude of destination in WGS 84 geodetic coordinates."""
  latitude(unit: AngleUnitEnum = DEGREE): Float @vspec(element: ACTUATOR, fqn: "Vehicle.Cabin.Infotainment.Navigation.DestinationSet.Latitude")
    @range(min: -90, max: 90)

  """Longitude of destination in WGS 84 geodetic coordinates."""
  longitude(unit: AngleUnitEnum = DEGREE): Float @vspec(element: ACTUATOR, fqn: "Vehicle.Cabin.Infotainment.Navigation.DestinationSet.Longitude")
    @range(min: -180, max: 180)
}